name: Check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r ggsel/runtime/requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          BUYWELL_EDGE_CONTRACTS_SKIP: "1"
      - run: python -m compileall -q ggsel funpay-cardinal playerok-universal ns-gifts tools tests
      - run: python tools/build_packages.py

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: buywell-runtimes
      - uses: actions/checkout@v4
        with:
          repository: moreveal/buywell-edge
          path: buywell-edge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./buywell-edge[test]"
      - run: >-
          python -m pip install
          beautifulsoup4==4.15.0
          httpx==0.28.1
          lxml==6.1.1
          requests==2.28.1
          requests-toolbelt==0.10.1
          websocket-client==1.8.0
          curl-cffi==0.13.0
          wrapper-tls-requests==1.1.4
          tqdm==4.67.1
      - run: python -m unittest discover -s tests -v
        working-directory: buywell-runtimes
        env:
          BUYWELL_EDGE_SOURCE: ${{ github.workspace }}/buywell-edge/src
          PYTHONDONTWRITEBYTECODE: "1"
      - run: python tools/build_edge_packages.py
        working-directory: buywell-runtimes
        env:
          BUYWELL_EDGE_SOURCE: ${{ github.workspace }}/buywell-edge/src
          PYTHONDONTWRITEBYTECODE: "1"
